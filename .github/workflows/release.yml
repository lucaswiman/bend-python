name: Release

# Publishes the pure-Python bend-python SDK, with PEP 740 provenance
# attestations, when a GitHub release is published.
# The release tag must be v<project version>, and CHANGELOG.md must have a dated
# section for that version (scripts/check-release.py). Needs a PyPI trusted
# publisher for this repository and workflow, using the "pypi" environment:
# https://docs.pypi.org/trusted-publishers/
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: The release must match the project version and the changelog
        run: uv run --no-project python scripts/check-release.py "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The built wheel installs and exposes its Bend library
        run: |
          uv run --no-project --isolated --with dist/bend_python-*-py3-none-any.whl \
            python -c 'import bend_python; assert (bend_python.library_path() / "python.bend").is_file()'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      # Unlike `uv publish`, this also signs and uploads PEP 740 attestations.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
